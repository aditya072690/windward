services:
  - type: web
    name: windward-api
    env: docker
    dockerfilePath: ./backend_v2/Dockerfile
    dockerContext: ./backend_v2
    envVars:
      - key: PERIOD_START
        value: 2026-08-29
      - key: PERIOD_END_EXCLUSIVE
        value: 2026-10-29
      - key: CACHE_DIR
        value: .cache/elexon
      - key: PORT
        value: 8000
